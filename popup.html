<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #263238;
      color: #eceff1;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #37474f;
    }
    .header img { width: 24px; height: 24px; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .saving-now {
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-bottom: 14px;
    }
    .saving-label { font-size: 11px; color: #a5d6a7; text-transform: uppercase; letter-spacing: 0.5px; }
    .saving-value { font-size: 28px; font-weight: 800; color: #fff; margin-top: 2px; }
    .saving-detail { font-size: 11px; color: #81c784; margin-top: 4px; }
    .section-label {
      font-size: 10px;
      color: #607d8b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .stats { display: flex; flex-direction: column; gap: 8px; }
    .stat {
      display: flex; justify-content: space-between; align-items: center;
      background: #37474f;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .stat-label { font-size: 12px; color: #90a4ae; }
    .stat-value { font-size: 16px; font-weight: 700; color: #eceff1; }
    .footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #37474f;
      display: flex;
      justify-content: center;
    }
    .reset {
      background: none;
      border: 1px solid #546e7a;
      color: #90a4ae;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .reset:hover { border-color: #ef5350; color: #ef5350; }
    .protected {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #37474f;
    }
    .protected .section-label { margin-bottom: 8px; }
    .add-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .add-row input {
      flex: 1;
      background: #37474f;
      border: 1px solid #546e7a;
      border-radius: 4px;
      color: #eceff1;
      font-size: 12px;
      padding: 5px 8px;
      outline: none;
    }
    .add-row input::placeholder { color: #607d8b; }
    .add-row input:focus { border-color: #4CAF50; }
    .add-row button {
      background: #2e7d32;
      border: none;
      color: #fff;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-row button:hover { background: #388e3c; }
    .url-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 120px;
      overflow-y: auto;
    }
    .url-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #37474f;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
      color: #b0bec5;
    }
    .url-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .url-item button {
      background: none;
      border: none;
      color: #607d8b;
      font-size: 14px;
      cursor: pointer;
      padding: 0 0 0 6px;
      line-height: 1;
    }
    .url-item button:hover { color: #ef5350; }
    .empty-msg {
      font-size: 11px;
      color: #546e7a;
      text-align: center;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="GroupNap">
    <h1>GroupNap</h1>
  </div>
  <div class="saving-now">
    <div class="saving-label">Saving right now</div>
    <div class="saving-value" id="currentSaving">—</div>
    <div class="saving-detail" id="currentTabs"></div>
  </div>
  <div class="section-label">Lifetime</div>
  <div class="stats">
    <div class="stat">
      <span class="stat-label">Tabs napped</span>
      <span class="stat-value" id="discarded">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Groups collapsed</span>
      <span class="stat-value" id="collapses">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Tabs protected</span>
      <span class="stat-value" id="skipped">0</span>
    </div>
  </div>
  <div class="protected">
    <div class="section-label">Protected sites</div>
    <div class="add-row">
      <input type="text" id="urlInput" placeholder="e.g. meet.google.com">
      <button id="addUrlBtn">Add</button>
    </div>
    <div class="url-list" id="urlList"></div>
  </div>
  <div class="footer">
    <button class="reset" id="resetBtn">Reset all</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
